<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Subneteo</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <header class="encabezado">
        <h1>Calculadora de Subneteo IPv4</h1>
        <p>Ejemplo de calculadora para subnetear redes IPv4</p>
    </header>

    <nav class="pestanas" role="tablist">
        <button type="button" class="pestana activa" data-panel="panel-binario" role="tab">Decimal -- Binario</button>
        <button type="button" class="pestana" data-panel="panel-flsm" role="tab">FLSM (subredes iguales)</button>
        <button type="button" class="pestana" data-panel="panel-vlsm" role="tab">VLSM (a la medida)</button>
        <button type="button" class="pestana" data-panel="panel-ip" role="tab">¿A qué red pertenece?</button>
    </nav>

    <main>
        <section id="panel-binario" class="panel activo">
            <h2>Convertir un octeto o una IP a binario</h2>
            <form id="form-binario" class="formulario">
                <label for="bin-entrada">Número (0 - 255) o IP completa</label>
                <input type="text" id="bin-entrada" value="192.168.50.0" autocomplete="off">
                <button type="submit">Convertir</button>
            </form>
            <div id="bin-resultado"></div>
        </section>

        <section id="panel-flsm" class="panel">
            <h2>Dividir una red en subredes del mismo tamaño</h2>
            <form id="form-flsm" class="formulario">
                <label for="flsm-prefijo">Prefijo o máscara</label>
                <input type="text" id="flsm-prefijo" value="/8" autocomplete="off">
                <label for="flsm-red">Red base</label>
                <input type="text" id="flsm-red" value="10.0.0.0" autocomplete="off">
                <label for="flsm-modo">Calcular por:
                    <select id="flsm-modo">
                        <option value="subredes">Número de subredes</option>
                        <option value="hostsPorSubred">Hosts por subred</option>
                    </select>
                </label>
                <label for="flsm-cantidad">Cantidad
                    <input type="number" min="1" value="16" id="flsm-cantidad">
                </label>
                <button type="submit">Subnetear</button>
            </form>
            <div id="flsm-resultado"></div>
        </section>

        <section id="panel-vlsm" class="panel">
            <h2>Ajustar a cada área el bloque que necesita</h2>
            <form id="form-vlsm" class="formulario">
                <label for="vlsm-prefijo">Prefijo o máscara</label>
                <input type="text" id="vlsm-prefijo" value="/24" autocomplete="off">
                <label for="vlsm-red">Red base</label>
                <input type="text" id="vlsm-red" value="192.168.50.0" autocomplete="off">
                <div class="requerimientos">
                    <div class="req-titulo">
                        <span>Área/subred</span><span>Hosts</span><span></span>
                    </div>
                    <div class="vlsm-filas" id="vlsm-filas"></div>
                    <button type="button" id="vlsm-agregar" class="secundario">Agregar subred</button>
                </div>
                <button type="submit">Subnetear</button>
            </form>
            <div id="vlsm-resultado"></div>
        </section>

        <section id="panel-ip" class="panel">
            <h2>Encontrar la red, el rango y el broadcast de una IP</h2>
            <form id="form-ip" class="formulario">
                <label for="ip-dir">Dirección IP
                    <input type="text" id="ip-dir" value="10.28.90.92" autocomplete="off">
                </label>
                <label for="ip-prefijo">Prefijo o máscara
                    <input type="text" id="ip-prefijo" value="/12" autocomplete="off">
                </label>
                <button type="submit">Analizar</button>
            </form>
            <div id="ip-resultado"></div>
        </section>
    </main>

    <script src="./js/subneteo.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
